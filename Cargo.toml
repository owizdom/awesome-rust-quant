[workspace]
resolver = "2"
members = [
    "numerical",
    "statistics",
    "rate_limit",
    "orderbook",
    "indicators",
    "machine_learning",
    "trading",
    "market_data",
    "risk",
    "time_series",
    "excel",
    "charts",
    "algorithms",
    "scrapers",
    "sentiment",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Awesome Rust Quant Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/awesome-rust-quant/awesome-rust-quant"

[workspace.dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

